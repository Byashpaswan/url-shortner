version: '3.8'

services:
  frontend:
    build:
      context: ./ClientSide/url-Shortner
      dockerfile: Dockerfile
    container_name: url-shortener-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url-shortener-backend
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/mydb
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: supersecretkeychangeinprod
      JWT_EXPIRES_IN: 7d
      BASE_URL: http://localhost:3000
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    container_name: url-shortener-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    container_name: url-shortener-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:
