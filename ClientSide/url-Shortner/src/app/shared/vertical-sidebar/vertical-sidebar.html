<nav class="nav flex-column p-2">
  <ul class="nav nav-pills flex-column mb-auto">
    <li *ngFor="let item of menuItems" class="nav-item">
      <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link d-flex align-items-center">
        <!-- icon placeholder: if you include an icon font, the icon class will work -->
        <i *ngIf="item.icon" class="me-2" [class]="item.icon" aria-hidden="true"></i>
        <span>{{ item.title }}</span>
      </a>
    </li>
    
    <!-- Logout action -->
    <li class="nav-item mt-4 border-top pt-3">
      <a href="javascript:void(0)" (click)="logout()" class="nav-link d-flex align-items-center text-danger logout-btn">
        <svg class="me-2" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Logout</span>
      </a>
    </li>
  </ul>
</nav>
